# Fly.io deployment config.
# Rename `app` and change `primary_region` before running `fly launch`.
# Secrets live in Fly (never commit): run `fly secrets set WAPI_TOKEN=... MISTRAL_API_KEY=... WEBHOOK_SECRET=... WAPI_INSTANCE_ID=...`.

app = "ai-wpp"             # change me
primary_region = "gru"     # São Paulo — keep close to your users
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8000"
  LOG_LEVEL = "INFO"
  AGENT_CHECKPOINT_DB = "/app/data/checkpoints.sqlite"

# Persistent SQLite volume for LangGraph checkpointer.
# Create it once with: `fly volumes create ai_wpp_data --region gru --size 1`
[[mounts]]
  source = "ai_wpp_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"   # keep the bot warm; webhook latency matters
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 200
    soft_limit = 150

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# Single-worker guarantee — see Dockerfile comment. Scale vertically first.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
